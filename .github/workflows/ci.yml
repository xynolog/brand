name: Brand CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

# A newer run of the same event on the same ref supersedes an older one. A
# merge queue entry has a ref of its own, so entries never cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every commit of a pull request is signed off by its author (the org's
  # CONTRIBUTING.md).
  dco:
    uses: xynolog/.github/.github/workflows/dco.yml@8e5e3b02c34517d3f8b49645330930983d07b7ac

  # On a push to main, the repository's labels become the org's.
  labels:
    uses: xynolog/.github/.github/workflows/labels.yml@8e5e3b02c34517d3f8b49645330930983d07b7ac
    permissions:
      issues: write

  generated:
    name: The committed icons are what src/mark.svg generates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Write every derivative again
        run: ./generate.sh
      - name: Nothing changed, appeared or disappeared
        run: |
          changed="$(git status --porcelain -- favicons app-icon)"
          if [ -n "$changed" ]; then
            echo "generate.sh writes something other than what is committed; run it and commit the result:" >&2
            echo "$changed" >&2
            exit 1
          fi

  # What the ruleset requires. It waits for every other job, a census holds
  # that list to the workflow's jobs, and it fails when any of them failed or
  # was cancelled. A job skipped by its own condition passes.
  gate:
    name: CI Gate
    if: always()
    needs: [dco, labels, generated]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/workflows
      - name: The gate waits for every other job
        run: |
          jobs="$(yq '.jobs | keys | .[] | select(. != "gate")' .github/workflows/ci.yml | sort)"
          waits="$(yq '.jobs.gate.needs[]' .github/workflows/ci.yml | sort)"
          if [ "$jobs" != "$waits" ]; then
            echo "CI Gate's needs differ from the workflow's jobs (< jobs, > needs):" >&2
            diff <(echo "$jobs") <(echo "$waits") >&2
            exit 1
          fi
      - name: Every job it waits for passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
